<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة - وين نلقى باتنة؟</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: linear-gradient(135deg,#eff6ff,#f8fafc);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.box {
    width: 92%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(15,23,42,.12);
}

.logo {
    text-align: center;
    color: #2563eb;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 8px;
}

h1 {
    text-align: center;
    font-size: 22px;
    margin: 10px 0;
}

.description {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    margin-bottom: 15px;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.error {
    background: #fee2e2;
    color: #b91c1c;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 15px;
}

.home {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #2563eb;
    text-decoration: none;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
وين نلقى باتنة؟
</div>

<h1>
لوحة الإدارة
</h1>

<p class="description">
تسجيل الدخول لإدارة الأماكن والمحلات
</p>

{% if error %}

<div class="error">
{{ error }}
</div>

{% endif %}

<form method="POST">

<label>
كلمة المرور
</label>

<input
type="password"
name="password"
placeholder="أدخل كلمة المرور"
required
autofocus
>

<button type="submit">
دخول إلى لوحة الإدارة
</button>

</form>

<a
class="home"
href="{{ url_for('home') }}"
>
العودة إلى الصفحة الرئيسية
</a>

</div>

</body>

</html>
