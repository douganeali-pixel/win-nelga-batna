<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تعديل المحل - وين نلقى باتنة؟</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --dark: #0f172a;
    --background: #f8fafc;
    --border: #e2e8f0;
    --muted: #64748b;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: var(--background);
    color: #0f172a;
}

header {
    background: linear-gradient(
        135deg,
        #1d4ed8,
        #2563eb,
        #3b82f6
    );

    color: white;
    padding: 22px 20px 35px;
}

.header {
    max-width: 850px;
    margin: auto;
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 21px;
    font-weight: bold;
}

.back-top {
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 9px 15px;
    border-radius: 9px;
    text-decoration: none;
}

.back-top:hover {
    background: white;
    color: var(--primary);
}

.header-title {
    text-align: center;
}

.header-title h1 {
    margin: 0;
    font-size: 30px;
}

.header-title p {
    margin: 8px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 850px;
    margin: -20px auto 50px;
    padding: 0 15px;
    position: relative;
}

.form-card {
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(15,23,42,0.10);
}

.form-section {
    margin-bottom: 28px;
}

.section-title {
    font-size: 19px;
    margin: 0 0 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
}

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: bold;
}

.required {
    color: var(--danger);
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

/* الصورة الحالية */

.current-image {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    margin-bottom: 15px;
}

.no-image {
    background: #f1f5f9;
    color: var(--muted);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    margin-bottom: 15px;
}

/* رفع الصورة */

.file-box {
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    background: #f8fafc;
}

.file-box input {
    border: none;
    background: transparent;
}

/* الخريطة */

.map-help {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

#map {
    width: 100%;
    height: 350px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.coordinates {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
}

.coordinates input {
    background: #f8fafc;
    color: #475569;
}

/* الأزرار */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 10px;
}

.save-button {
    width: 100%;
    border: none;
    background: var(--primary);
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: var(--primary-dark);
}

.cancel-button {
    display: block;
    text-align: center;
    background: #f1f5f9;
    color: #475569;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
}

.cancel-button:hover {
    background: #e2e8f0;
}

/* حذف */

.delete-section {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid var(--border);
}

.delete-button {
    width: 100%;
    border: none;
    background: var(--danger);
    color: white;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.delete-button:hover {
    background: var(--danger-dark);
}

footer {
    background: var(--dark);
    color: #94a3b8;
    text-align: center;
    padding: 25px;
    font-size: 14px;
}

footer strong {
    color: white;
}

@media (max-width: 600px) {

    header {
        padding: 18px 12px 30px;
    }

    .logo {
        font-size: 18px;
    }

    .back-top {
        font-size: 13px;
        padding: 8px 11px;
    }

    .header-title h1 {
        font-size: 25px;
    }

    .form-card {
        padding: 20px 15px;
    }

    .row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .coordinates {
        grid-template-columns: 1fr;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    #map {
        height: 300px;
    }

}


</style>

</head>

<body>


<header>

<div class="header">

<div class="top">

<a
class="logo"
href="{{ url_for('home') }}"
>
وين نلقى باتنة؟
</a>

<a
class="back-top"
href="{{ url_for('place', place_id=place.id) }}"
>
تفاصيل المحل
</a>

</div>

<div class="header-title">

<h1>
تعديل المحل
</h1>

<p>
تعديل معلومات وموقع المحل
</p>

</div>

</div>

</header>


<main class="container">


<form
class="form-card"
method="POST"
>


<section class="form-section">

<h2 class="section-title">
معلومات المحل
</h2>


<div class="field">

<label>
اسم المحل
<span class="required">*</span>
</label>

<input
type="text"
name="name"
value="{{ place.name }}"
required
>

</div>


<div class="field">

<label>
التصنيف
<span class="required">*</span>
</label>

<select
name="category"
required
>

<option value="">
اختر التصنيف
</option>

<option
value="سيارات وقطع غيار"
{% if place.category == "سيارات وقطع غيار" %}selected{% endif %}
>
سيارات وقطع غيار
</option>

<option
value="أطباء وصحة"
{% if place.category == "أطباء وصحة" %}selected{% endif %}
>
أطباء وصحة
</option>

<option
value="مطاعم وحلويات"
{% if place.category == "مطاعم وحلويات" %}selected{% endif %}
>
مطاعم وحلويات
</option>

<option
value="إلكترونيات"
{% if place.category == "إلكترونيات" %}selected{% endif %}
>
إلكترونيات
</option>

<option
value="حرفيون"
{% if place.category == "حرفيون" %}selected{% endif %}
>
حرفيون
</option>

<option
value="محلات"
{% if place.category == "محلات" %}selected{% endif %}
>
محلات
</option>

<option
value="مواد البناء"
{% if place.category == "مواد البناء" %}selected{% endif %}
>
مواد البناء
</option>

<option
value="خدمات"
{% if place.category == "خدمات" %}selected{% endif %}
>
خدمات
</option>

</select>

</div>


<div class="field">

<label>
العنوان
<span class="required">*</span>
</label>

<input
type="text"
name="address"
value="{{ place.address }}"
required
>

</div>


<div class="field">

<label>
رقم الهاتف
</label>

<input
type="text"
name="phone"
value="{{ place.phone or '' }}"
>

</div>


<div class="field">

<label>
الوصف
</label>


<div class="form-group">
    <label for="opening_time">وقت الفتح</label>
    <input type="time" id="opening_time" name="opening_time"
           value="{{ place.opening_time if place is defined and place.opening_time else '08:00' }}">
</div>

<div class="form-group">
    <label for="closing_time">وقت الإغلاق</label>
    <input type="time" id="closing_time" name="closing_time"
           value="{{ place.closing_time if place is defined and place.closing_time else '18:00' }}">
</div>

<div class="form-group">
    <label for="working_days">أيام العمل</label>
    <input type="text" id="working_days" name="working_days"
           value="{{ place.working_days if place is defined and place.working_days else '1,2,3,4,5,6' }}"
           placeholder="1,2,3,4,5,6">
    <small>1=الإثنين، 2=الثلاثاء ... 7=الأحد</small>
</div>

<textarea
name="description"
>{{ place.description or '' }}</textarea>

</div>

</section>


<section class="form-section">

<h2 class="section-title">
موقع المحل
</h2>

<p class="map-help">
اضغط على الخريطة لتغيير موقع المحل.
</p>


<div id="map"></div>


<div class="coordinates">

<div>

<label>
خط العرض Latitude
</label>

<input
type="text"
id="latitude"
name="latitude"
value="{{ place.latitude or '' }}"
readonly
>

</div>


<div>

<label>
خط الطول Longitude
</label>

<input
type="text"
id="longitude"
name="longitude"
value="{{ place.longitude or '' }}"
readonly
>

</div>

</div>

</section>


<div class="buttons">

<button
type="submit"
class="save-button"
>
حفظ التعديلات
</button>


<a
class="cancel-button"
href="{{ url_for('place', place_id=place.id) }}"
>
إلغاء
</a>

</div>


</form>


<div class="delete-section">

<form
method="POST"
action="{{ url_for('delete_place', place_id=place.id) }}"
onsubmit="return confirm('هل أنت متأكد من حذف هذا المحل؟ لا يمكن التراجع عن هذا الإجراء.');"
>

<button
type="submit"
class="delete-button"
>
حذف هذا المحل نهائيًا
</button>

</form>

</div>


</main>


<footer>

<strong>
وين نلقى باتنة؟
</strong>

<br>

دليلك المحلي للعثور على الأماكن والخدمات في باتنة

</footer>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

const defaultLatitude = {{ place.latitude if place.latitude else 35.5559 }};
const defaultLongitude = {{ place.longitude if place.longitude else 6.1741 }};


const map = L.map("map").setView(
    [
        defaultLatitude,
        defaultLongitude
    ],
    16
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


let marker = L.marker(
    [
        defaultLatitude,
        defaultLongitude
    ],
    {
        draggable: true
    }
).addTo(map);

function updateCoordinates(lat, lng) {

    document.getElementById("latitude").value =
        lat.toFixed(6);

    document.getElementById("longitude").value =
        lng.toFixed(6);
}

marker.on("dragend", function(event) {

    const position = event.target.getLatLng();

    updateCoordinates(
        position.lat,
        position.lng
    );

    marker
        .bindPopup("الموقع الجديد")
        .openPopup();
});

marker.bindPopup(
    "موقع المحل"
).openPopup();

map.on("click", function(event) {

    updateCoordinates(
        event.latlng.lat,
        event.latlng.lng
    );

    marker.setLatLng(event.latlng);

    marker
        .bindPopup("الموقع الجديد")
        .openPopup();

});

</script>


</body>

</html>
